<div class="modal fade" id="medicineModal" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-scrollable"><form class="modal-content" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="modal-header"><div><h2 class="modal-title fs-5">Add medicine</h2><p>Set a dose, schedule, and stock level.</p></div><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><div class="row g-3"><div class="col-md-6"><label>Medicine name *</label><input name="medicine_name" required></div><div class="col-md-6"><label>Medicine type *</label><select name="medicine_type" required>{% for t in ['Tablet','Syrup','Injection','Capsule','Other'] %}<option>{{ t }}</option>{% endfor %}</select></div><div class="col-md-4"><label>Dosage *</label><input name="dosage" placeholder="e.g. 1 tablet" required></div><div class="col-md-4"><label>Time *</label><input name="time" type="time" required></div><div class="col-md-4"><label>Frequency *</label><input name="frequency" placeholder="e.g. Daily" required></div><div class="col-md-6"><label>Start date</label><input name="start_date" type="date"></div><div class="col-md-6"><label>End date</label><input name="end_date" type="date"></div><div class="col-md-4"><label>Meal instruction</label><select name="meal_instruction"><option value="">Any time</option><option>Before meal</option><option>After breakfast</option><option>After lunch</option><option>After dinner</option></select></div><div class="col-md-4"><label>Quantity</label><input name="quantity" type="number" min="0" value="0"></div><div class="col-md-4"><label>Refill threshold</label><input name="refill_threshold" type="number" min="0" value="3"></div><div class="col-12"><label>Notes</label><textarea name="notes" rows="3" placeholder="Any special instructions"></textarea></div></div></div><div class="modal-footer"><button class="btn btn-light-border" type="button" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary-soft">Save medicine</button></div></form></div></div>
