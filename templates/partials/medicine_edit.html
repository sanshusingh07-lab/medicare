<div class="modal fade" id="editMedicine{{ med.medicine_id }}" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-scrollable"><form class="modal-content" method="post" action="{{ url_for('edit_medicine', medicine_id=med.medicine_id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="modal-header"><h2 class="modal-title fs-5">Edit {{ med.medicine_name }}</h2><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><div class="row g-3"><div class="col-md-6"><label>Medicine name</label><input name="medicine_name" value="{{ med.medicine_name }}" required></div><div class="col-md-6"><label>Type</label><select name="medicine_type">{% for t in ['Tablet','Syrup','Injection','Capsule','Other'] %}<option {{ 'selected' if med.medicine_type == t }}>{{ t }}</option>{% endfor %}</select></div><div class="col-md-4"><label>Dosage</label><input name="dosage" value="{{ med.dosage }}" required></div><div class="col-md-4"><label>Time</label><input name="time" type="time" value="{{ med.time.strftime('%H:%M') }}" required></div><div class="col-md-4"><label>Frequency</label><input name="frequency" value="{{ med.frequency }}" required></div><div class="col-md-6"><label>Start date</label><input name="start_date" type="date" value="{{ med.start_date or '' }}"></div><div class="col-md-6"><label>End date</label><input name="end_date" type="date" value="{{ med.end_date or '' }}"></div><div class="col-md-4"><label>Meal instruction</label><input name="meal_instruction" value="{{ med.meal_instruction or '' }}"></div><div class="col-md-4"><label>Quantity</label><input name="quantity" type="number" value="{{ med.quantity }}"></div><div class="col-md-4"><label>Refill threshold</label><input name="refill_threshold" type="number" value="{{ med.refill_threshold }}"></div><div class="col-12"><label>Notes</label><textarea name="notes" rows="3">{{ med.notes or '' }}</textarea></div></div></div><div class="modal-footer"><button type="button" class="btn btn-light-border" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary-soft">Save changes</button></div></form></div></div>
