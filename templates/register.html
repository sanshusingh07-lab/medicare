{% extends 'base.html' %}{% block title %}Create account | MediCare+{% endblock %}{% block public_content %}<div class="auth-layout register-layout"><a class="brand auth-brand" href="{{ url_for('index') }}"><span class="brand-mark"><i class="bi bi-heart-pulse-fill"></i></span><span>MediCare<span>+</span></span></a><div class="auth-card register-card"><span class="auth-icon"><i class="bi bi-person-plus"></i></span><h1>Create your health space</h1><p>Start organizing your health in just a few minutes.</p><form method="post" class="row g-3"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="col-md-6"><label>Full name *</label><input name="name" required></div><div class="col-md-6"><label>Email address *</label><input name="email" type="email" required></div><div class="col-md-6"><label>Password *</label><input name="password" type="password" minlength="8" required></div><div class="col-md-6"><label>Confirm password *</label><input name="confirm_password" type="password" minlength="8" required></div><div class="col-md-4"><label>Age *</label><input name="age" type="number" min="1" max="120" required></div><div class="col-md-4"><label>Gender *</label><select name="gender" required><option value="">Choose</option><option>Female</option><option>Male</option><option>Non-binary</option><option>Prefer not to say</option></select></div><div class="col-md-4"><label>Blood group *</label><select name="blood_group" required><option value="">Choose</option>{% for group in ['A+','A-','B+','B-','AB+','AB-','O+','O-'] %}<option>{{ group }}</option>{% endfor %}</select></div><div class="col-md-6"><label>Emergency contact name *</label><input name="emergency_contact_name" required></div><div class="col-md-6"><label>Emergency contact number *</label><input name="emergency_contact_number" type="tel" required></div><div class="col-12"><button class="btn btn-primary-soft w-100 btn-lg">Create my account <i class="bi bi-arrow-right"></i></button></div></form><p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p></div></div>{% endblock %}
