{% extends 'base.html' %}{% block title %}Login | MediCare+{% endblock %}{% block public_content %}<div class="auth-layout"><a class="brand auth-brand" href="{{ url_for('index') }}"><span class="brand-mark"><i class="bi bi-heart-pulse-fill"></i></span><span>MediCare<span>+</span></span></a><div class="auth-card"><span class="auth-icon"><i class="bi bi-shield-heart"></i></span><h1>Welcome back</h1><p>Log in to your personal health space.</p><form method="post" class="row g-3"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="col-12"><label>Email address</label><div class="input-icon"><i class="bi bi-envelope"></i><input name="email" type="email" placeholder="you@example.com" required></div></div><div class="col-12"><label>Password</label><div class="input-icon"><i class="bi bi-lock"></i><input name="password" type="password" placeholder="Enter your password" required></div></div><div class="col-12 d-flex justify-content-between align-items-center"><label class="check-label"><input type="checkbox" name="remember"> Remember me</label><a class="form-link" href="mailto:care@medicare.local?subject=Password reset">Forgot password?</a></div><div class="col-12"><button class="btn btn-primary-soft w-100 btn-lg">Log in <i class="bi bi-arrow-right"></i></button></div></form><p class="auth-switch">New to MediCare+? <a href="{{ url_for('register') }}">Create an account</a></p></div><p class="auth-footer"><i class="bi bi-shield-check"></i> Your health information is protected.</p></div>{% endblock %}
