services:
  - type: web
    name: medicare-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app app.py init-db && gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: medicare-db
          property: connectionString

databases:
  - name: medicare-db
    databaseName: medicare
    user: medicare
    plan: free
